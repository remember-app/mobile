name: mobile ios build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build and submit profile
        required: true
        type: choice
        options: [testflight, production]
        default: testflight
  push:
    tags: ['mobile-v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: build
        run: npx --yes eas-cli build --profile ${{ inputs.profile || 'production' }} --platform ios --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: submit
        run: npx --yes eas-cli submit --profile ${{ inputs.profile || 'production' }} --platform ios --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
